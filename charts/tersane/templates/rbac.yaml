{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tersane.serviceAccountName" . }}
  labels:
    {{- include "tersane.labels" . | nindent 4 }}
---
{{- end }}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tersane.fullname" . }}-reader
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, namespaces, events, configmaps, secrets, persistentvolumeclaims, persistentvolumes, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [resourcequotas, limitranges]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tersane.fullname" . }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "tersane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "tersane.fullname" . }}-reader
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.rbac.mutations }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tersane.fullname" . }}-operator
  namespace: {{ default .Release.Namespace .Values.env.watchNamespace }}
rules:
  - apiGroups: ["", apps, batch, networking.k8s.io, autoscaling, policy]
    resources: [pods, deployments, replicasets, statefulsets, daemonsets, jobs, cronjobs, services, configmaps, secrets, persistentvolumeclaims, ingresses, networkpolicies, horizontalpodautoscalers, poddisruptionbudgets, resourcequotas, limitranges]
    verbs: [get, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments/scale, replicasets/scale, statefulsets/scale]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [pods/resize]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tersane.fullname" . }}-operator
  namespace: {{ default .Release.Namespace .Values.env.watchNamespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tersane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "tersane.fullname" . }}-operator
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if or .Values.rbac.exec .Values.rbac.portForward }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tersane.fullname" . }}-sessions
  namespace: {{ default .Release.Namespace .Values.env.watchNamespace }}
rules:
  {{- if .Values.rbac.exec }}
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  {{- end }}
  {{- if .Values.rbac.portForward }}
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tersane.fullname" . }}-sessions
  namespace: {{ default .Release.Namespace .Values.env.watchNamespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tersane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "tersane.fullname" . }}-sessions
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if .Values.rbac.nodeMaintenance }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tersane.fullname" . }}-node-maintenance
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tersane.fullname" . }}-node-maintenance
subjects:
  - kind: ServiceAccount
    name: {{ include "tersane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "tersane.fullname" . }}-node-maintenance
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
