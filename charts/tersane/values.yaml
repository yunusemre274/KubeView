replicaCount: 1
nameOverride: ""
fullnameOverride: ""
image:
  # Build/load kubeview:local or explicitly set your own trusted registry image.
  # This chart does not claim a published GHCR image exists.
  repository: kubeview
  pullPolicy: IfNotPresent
  tag: "local"
serviceAccount:
  create: true
  name: ""
rbac:
  create: true
  # Writes are opt-in, limited to watchNamespace (or the release namespace).
  mutations: false
  nodeMaintenance: false
  exec: false
  portForward: false
auth:
  # Secret must contain key token. If empty, Helm generates a release-local secret.
  existingSecret: ""
service:
  type: ClusterIP
  port: 8000
  nodePort: null
resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
env:
  watchNamespace: ""
  port: "8000"
