# Example only. Use an existing namespace you own; replace kubeview-example.
# No Node/Namespace LIST, Secret reads, cluster-admin or wildcard access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeview-observer
  namespace: kubeview-example
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeview-observer
  namespace: kubeview-example
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, configmaps, events, persistentvolumeclaims, resourcequotas, limitranges, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeview-observer
  namespace: kubeview-example
subjects:
  - kind: ServiceAccount
    name: kubeview-observer
    namespace: kubeview-example
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeview-observer
