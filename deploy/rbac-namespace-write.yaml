# Optional workload management for the observer identity. READ_ONLY defaults true
# and browser management consent are additional gates, never Kubernetes roles.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeview-workloads
  namespace: kubeview-example
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments/scale, statefulsets/scale]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeview-workloads
  namespace: kubeview-example
subjects:
  - kind: ServiceAccount
    name: kubeview-observer
    namespace: kubeview-example
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeview-workloads
