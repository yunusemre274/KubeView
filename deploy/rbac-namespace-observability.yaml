# Optional logs and Pod metrics. They are not implied by metadata read access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeview-observability
  namespace: kubeview-example
rules:
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeview-observability
  namespace: kubeview-example
subjects:
  - kind: ServiceAccount
    name: kubeview-observer
    namespace: kubeview-example
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeview-observability
